name: Generate Land Cover Map

on:
  workflow_dispatch:
    inputs:
      country_code:
        description: "Country ISO code or name to render (ignored if aoi_geojson is set)"
        required: false
        default: "BA"
      aoi_geojson:
        description: "Custom area of interest as GeoJSON (Geometry/Feature/FeatureCollection). Overrides country_code."
        required: false
        default: ""
      output_format:
        description: "Output format"
        required: true
        default: "png"
        type: choice
        options:
          - png
          - jpg
          - pdf
      title:
        description: "Title printed at the top of a PDF export (ignored for png/jpg)"
        required: false
        default: ""
      mode:
        description: "Export mode for the generated image"
        required: true
        default: "3d"
        type: choice
        options:
          - "3d"
          - "2d"
      aggregate:
        description: "Downsample factor for the generated export"
        required: true
        default: "5"
      email:
        description: "Email the finished map here when done (optional, requires repo owner to have set MAIL_USERNAME/MAIL_PASSWORD secrets)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate land cover export
        id: generate
        env:
          COUNTRY_CODE: ${{ github.event.inputs.country_code }}
          AOI_GEOJSON: ${{ github.event.inputs.aoi_geojson }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          MODE: ${{ github.event.inputs.mode }}
          AGGREGATE: ${{ github.event.inputs.aggregate }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          mkdir -p out
          python Python/generate_map.py \
            --country "$COUNTRY_CODE" \
            --aoi-geojson "$AOI_GEOJSON" \
            --output "out/land-cover-map.$OUTPUT_FORMAT" \
            --mode "$MODE" \
            --aggregate "$AGGREGATE" \
            --title "$TITLE"
      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-land-cover-map-${{ github.run_id }}
          path: out/
      - name: Check mail secrets are configured
        id: mail_check
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Email the generated map
        if: ${{ github.event.inputs.email != '' && steps.mail_check.outputs.configured == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 3D Land Cover Map Generator
          to: ${{ github.event.inputs.email }}
          subject: "Your 3D land cover map is ready"
          body: "Your requested export is attached. Generated by run #${{ github.run_number }} of the 3d-export workflow."
          attachments: ${{ steps.generate.outputs.output_path }}
